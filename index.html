<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Planner</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>

<!-- Scenic Background -->
<div class="sky-bg" aria-hidden="true">
  <div class="sky-gradient"></div>
  <div class="sun"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>
  <div class="city">
    <div class="building" style="--w:10px;--h:48px"></div>
    <div class="building" style="--w:16px;--h:68px"></div>
    <div class="building" style="--w:12px;--h:55px"></div>
    <div class="building" style="--w:22px;--h:92px"></div>
    <div class="building" style="--w:14px;--h:62px"></div>
    <div class="building" style="--w:28px;--h:112px"></div>
    <div class="building" style="--w:18px;--h:78px"></div>
    <div class="building" style="--w:10px;--h:50px"></div>
    <div class="building" style="--w:24px;--h:98px"></div>
    <div class="building" style="--w:16px;--h:66px"></div>
    <div class="building" style="--w:20px;--h:84px"></div>
    <div class="building" style="--w:12px;--h:52px"></div>
    <div class="building" style="--w:18px;--h:72px"></div>
    <div class="building" style="--w:10px;--h:44px"></div>
  </div>
  <div class="hills">
    <div class="hill hill-1"></div>
    <div class="hill hill-2"></div>
    <div class="hill hill-3"></div>
  </div>
  <div class="bird bird-1">✦</div>
  <div class="bird bird-2">✦</div>
  <div class="bird bird-3">✦</div>
</div>

<div class="app-layout">
  <header class="topbar">
    <div class="logo">Study<span>.</span>Planner</div>
    <div class="topbar-actions">
      <button id="export-btn" class="btn-ghost" title="Export backup">Export</button>
      <button id="import-btn" class="btn-ghost" title="Import backup">Import</button>
      <button id="undo-btn" class="btn-ghost" title="Undo last delete">Undo</button>
      <input id="import-input" type="file" accept="application/json,.json" hidden/>
      <button id="theme-toggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="content">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Tasks</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-card stat-done">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-done">0</div>
      </div>
      <div class="stat-card stat-pending">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="stat-pending">0</div>
      </div>
      <div class="stat-card stat-overdue">
        <div class="stat-label">Overdue</div>
        <div class="stat-value" id="stat-overdue">0</div>
      </div>
      <div class="stat-card stat-due-week">
        <div class="stat-label">Due This Week</div>
        <div class="stat-value" id="stat-due-week">0</div>
      </div>
      <div class="stat-card stat-rate">
        <div class="stat-label">Completion Rate</div>
        <div class="stat-value" id="stat-rate">0%</div>
      </div>
    </div>

    <div class="glass-card">
      <div class="card-title">📊 <span>Statistics by Subject</span></div>
      <div id="subject-stats"></div>
    </div>

    <div class="glass-card form-card">
      <div class="card-title">✏️ <span id="form-title">New Task</span></div>
      <div id="form-error" class="form-error"></div>
      <form id="task-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="input-subject">Subject</label>
            <input id="input-subject" type="text" placeholder="e.g. Mathematics" autocomplete="off"/>
          </div>
          <div class="field">
            <label for="input-title">Task Title</label>
            <input id="input-title" type="text" placeholder="e.g. Chapter 5 exercises" autocomplete="off"/>
          </div>
          <div class="field">
            <label for="input-deadline">Deadline</label>
            <input id="input-deadline" type="date"/>
          </div>
          <div class="field">
            <label for="input-notes">Notes (optional)</label>
            <input id="input-notes" type="text" placeholder="Any extra details…" autocomplete="off"/>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn-primary">Add Task</button>
          <button type="button" id="cancel-edit-btn" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>

    <div class="glass-card">
      <div class="card-title">📋 <span>Tasks</span></div>
      <div class="filters-row">
        <span class="filters-label">Filter by:</span>
        <select id="filter-status" class="filter-select">
          <option value="all">All Status</option>
          <option value="pending">Pending</option>
          <option value="done">Completed</option>
          <option value="overdue">Overdue</option>
          <option value="dueToday">Due Today</option>
          <option value="dueThisWeek">Due This Week</option>
        </select>
        <select id="filter-subject" class="filter-select">
          <option value="">All Subjects</option>
        </select>
      </div>
      <div id="task-list"></div>
    </div>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
